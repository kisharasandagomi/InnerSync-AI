# InnerSync AI — conda environment (exported from `mainks`, Python 3.13.14)
#
# Rebuilt inside WSL2 Ubuntu — see docs/decisions/ADR.md (ADR-002) for why:
# the native Windows conda env was blocked by Windows Smart App Control from
# loading compiled package DLLs (pandas, lightgbm, etc.). Local development
# now happens inside WSL2, not native Windows Python.
#
# Recreate with (inside WSL):
#   conda env create -f environment.yml
#   conda activate mainks
#
# Regenerate after adding a package with:
#   conda env export -n mainks --no-builds > environment.yml
# then strip the machine-specific `prefix:` line this raw export adds.
#
# NOTE: catboost, tensorflow, keras, scikeras, plotly, and graphviz were
# present in the original Windows-native mainks env but are not part of the
# WSL rebuild — add them back here (and `pip install` them into the WSL env)
# if/when they're needed again. pytest, black, and ruff have been reinstalled
# per IMPLEMENTATION_RULES.md's testing/style requirements.
#
# NOTE (Phase 7): `nodejs` (conda-forge) added for the frontend toolchain —
# this update was missed at the time and is being backfilled here now.
# NOTE (this session): `nltk`, `regex`, `textblob`, `vadersentiment` added for
# the descriptive sentiment scoring in the NLP ablation study
# (`05_NLP_Ablation.ipynb`). Installed with the user's explicit go-ahead per
# the project's "ask before installing" rule.

