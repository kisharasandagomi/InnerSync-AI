# InnerSync AI — conda environment (exported from `mainks`, Python 3.13.13)
#
# Recreate with:
#   conda env create -f environment.yml
#   conda activate mainks
#
# Regenerate after adding a package with:
#   conda env export -n mainks --no-builds > environment.yml
# then strip the machine-specific `prefix:` line this raw export adds.
#
# NOTE: `irrigation-need-prediction==0.1.0` below is not an InnerSync AI
# dependency — it appears to be a leftover pip install from an unrelated
# prior project in this env. Left in so this file matches the env exactly;
# confirm whether to `pip uninstall` it from `mainks` and re-export.

